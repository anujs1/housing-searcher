[project]
name = "housing-searcher"
version = "0.1.0"
description = "Personal-use pipeline for structured housing data from Facebook groups"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "playwright>=1.61.0",
]

[project.scripts]
housing-searcher = "housing_searcher.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
